services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run ./backend/start-local.sh to generate local settings}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run ./backend/start-local.sh to generate local settings}
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run ./backend/start-local.sh to generate local settings}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://127.0.0.1:${WP_PORT:-8081}');
        define('WP_SITEURL', 'http://127.0.0.1:${WP_PORT:-8081}');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
    ports:
      - "127.0.0.1:${WP_PORT:-8081}:80"
    volumes:
      - wordpress_files:/var/www/html
      - ./wp-content/plugins/crux-climbing-gym:/var/www/html/wp-content/plugins/crux-climbing-gym:ro
      - ../frontend/build/web:/var/www/html/topo:ro
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$socket = @fsockopen('127.0.0.1', 80); exit($$socket ? 0 : 1);",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  wpcli:
    profiles: ["tools"]
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run ./backend/start-local.sh to generate local settings}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_files:/var/www/html
      - ./wp-content/plugins/crux-climbing-gym:/var/www/html/wp-content/plugins/crux-climbing-gym:ro
      - ./dev:/tmp/topo-dev:ro
    working_dir: /var/www/html
    entrypoint: ["wp"]

volumes:
  wordpress_db:
  wordpress_files:
